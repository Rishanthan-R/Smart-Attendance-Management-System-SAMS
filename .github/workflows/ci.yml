name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop ]

jobs:
  frontend-check:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sams-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./sams-frontend
        run: npm ci

      - name: Run linter
        working-directory: ./sams-frontend
        run: npm run lint

      - name: Build project
        working-directory: ./sams-frontend
        run: npm run build
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: '22.x'
    - name: Install Dependencies
      run: npm ci
      working-directory: ./sams-backend
    - name: Run Tests
      env:
        SUPABASE_URL: "https://dummy-test-url.supabase.co"
        SUPABASE_SERVICE_ROLE_KEY: "dummy-test-key"
      run: npm test
      working-directory: ./sams-backend
