name: CI — Build & Lint Check

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  frontend-check:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sams-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./sams-frontend
        run: npm ci

      - name: Run linter
        working-directory: ./sams-frontend
        run: npm run lint

      - name: Build project
        working-directory: ./sams-frontend
        run: npm run build

  backend-check:
    name: Backend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sams-backend/package-lock.json

      - name: Install dependencies
        working-directory: ./sams-backend
        run: npm install

      - name: TypeScript type check
        working-directory: ./sams-backend
        run: npx tsc --noEmit

      - name: Build project
        working-directory: ./sams-backend
        run: npm run build
