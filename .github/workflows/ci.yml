name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: '22.x'
    - name: Install Dependencies
      run: npm ci
      working-directory: ./sams-backend
    - name: Run Tests
      env:
        SUPABASE_URL: "https://dummy-test-url.supabase.co"
        SUPABASE_SERVICE_ROLE_KEY: "dummy-test-key"
      run: npm test
      working-directory: ./sams-backend